<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Artem Pelenitsyn &middot; $title$</title>
        <link href="https://gmpg.org/xfn/11" rel="profile">
        <meta http-equiv="x-ua-compatible" content="ie=edge">

        <!-- CSS -->
        <link rel="stylesheet" href="/css/poole.css" />
        <link rel="stylesheet" href="/css/ukraine.css" />
        <link rel="stylesheet" href="/css/custom.css" />
        <!-- Anti-FOUC: apply stored/OS theme before first paint -->
        <script>(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}})();</script>
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons/css/academicons.min.css">
        <link rel="shortcut icon" href="/images/favicon.ico">
        <!-- Tailwind utility classes (preflight off to avoid conflicts with Poole) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>tailwind.config = { corePlugins: { preflight: false }, darkMode: ['selector', '[data-theme="dark"]'] }</script>
    </head>
    <body>
    <a class="support-ukraine" href="https://help.unicef.org/ukraine-emergency" target="_blank" rel="nofollow noopener" title="I condemn the war Russian government started in Ukraine">
      <div class="support-ukraine__flag" role="img" aria-label="Flag of Ukraine">
        <div class="support-ukraine__flag__blue"></div>
        <div class="support-ukraine__flag__yellow"></div>
      </div>
      <div class="support-ukraine__label">I condemn the war Russian government started in Ukraine. Click here to help.</div>
    </a>
    <div class="container content">
      <div class="masthead">
            <h3 class="masthead-title">
                <a href="/">Artem Pelenitsyn</a>
                <small>Homepage</small>
                <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
            </h3>
            <!-- <nav>
                 <a href="/">Home</a>
                 <a href="/about.html">About</a>
                 <a href="/contact.html">Contact</a>
                 <a href="/archive.html">Archive</a>
                 </nav> -->
      </div>

        <main role="main">
            $body$
        </main>

        <footer class="flex flex-col sm:flex-row border border-solid border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 divide-solid divide-y sm:divide-y-0 sm:divide-x divide-gray-200 dark:divide-gray-600 text-xs text-center" style="margin-top:1rem">
          <div class="flex-1 p-1">(&#8580;) 2026, A. Pelenitsyn</div>
          <div class="flex-1 p-1"><a href="https://github.com/a-pelenitsyn/a-pelenitsyn.github.io">GitHub Sources</a></div>
          <div class="flex-1 p-1">Site proudly generated by
            <a href="https://jaspervdj.be/hakyll">Hakyll</a></div>
        </footer>
    </div>
    <script>
      (function() {
        var btn = document.getElementById('theme-toggle');
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function isDark() {
          return document.documentElement.getAttribute('data-theme') === 'dark';
        }
        function updateIcon() { btn.textContent = isDark() ? '🌞' : '🌙'; }
        updateIcon();
        btn.addEventListener('click', function() {
          var next = isDark() ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateIcon();
        });
      })();
    </script>
    </body>
</html>
